name: release-please

# Mantém o PR de versão em develop e, no merge dele, cria a tag e a release
# (docs/decisoes/0001-repositorio-proprio.md, decisão 3).
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Quem escreve é o RELEASE_PLEASE_TOKEN, não o GITHUB_TOKEN: um PR aberto pelo GITHUB_TOKEN
# não dispara o CI, e o check obrigatório travaria o merge do PR de versão.
permissions: {}

concurrency:
  group: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
