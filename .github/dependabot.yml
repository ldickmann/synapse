version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    # Espera a versão ter alguns dias de publicada, como o minimumReleaseAge do pnpm.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: build(deps)
    # Minor e patch em dois PRs, um por tipo de dependência; cada major vem num PR só seu.
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # O TypeScript fica no 6: o typescript-eslint 8.72.2 só aceita TypeScript abaixo de 6.1.0.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # O @types/node acompanha o major do Node, 26.x no engines e no .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: '06:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 3
    commit-message:
      prefix: build(deps)
    groups:
      actions:
        patterns: ['*']
